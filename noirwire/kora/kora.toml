# Kora configuration for v2.2.0-beta.8, the DEFAULT. Built by Dockerfile.
#
# WARNING: run this only behind a caller that verifies the whole transaction and enforces its
# own minimum payment, rent included, for every transaction in which the fee payer funds a
# token account. Never expose it directly. This release is newer than Kora's audit; see
# "Stable or pre-release" in ../README.md for why it is the default anyway and what guards it.
[kora]
rate_limit = 20
payment_address = "3QTwdXo2wUg7KsXh4T7LPsg1Rh6krMdq69igjnko5RFw"

[kora.auth]
max_timestamp_age = 60

[kora.enabled_methods]
liveness = true
estimate_transaction_fee = true
get_supported_tokens = false
get_payer_signer = true
sign_transaction = true
sign_and_send_transaction = false
transfer_transaction = false
get_blockhash = false
get_config = true
get_version = true
estimate_bundle_fee = false
sign_and_send_bundle = false
sign_bundle = false

[validation]
# The most the fee payer may spend on one transaction. Opening a Token-2022 account costs
# 2,136,720 lamports of rent (a classic token account 2,039,280), so 2,200,000 admits exactly
# one account creation per transaction: two are refused.
max_allowed_lamports = 2200000
max_signatures = 2
price_source = "Jupiter"
allow_durable_transactions = false
allowed_programs = [
    "11111111111111111111111111111111",
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",
    "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb",
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",
    "jup3YeL8QhtSx1e253b2FDvsMNC87fDrgQZivbrndc9",
    "jupeiUmn818Jg1ekPURTpr4mFo29p46vygyykFJ3wZC",
]
allowed_tokens = ["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"]
allowed_spl_paid_tokens = ["EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"]
disallowed_accounts = []

[validation.price]
type = "margin"
# Kora's own margin over the network cost. The price the user sees is set by the caller,
# which may charge more than this: Kora accepts any payment at or above what it requires.
margin = 0.1

[validation.fee_payer_policy.system]
allow_transfer = false
allow_assign = false
allow_create_account = true
allow_allocate = false

[validation.token_2022]
# Required for the tracker mints, whose transfer-hook authority is set though no hook program
# is: the default policy refuses them. A hook program would also have to be on
# allowed_programs for Kora to sign a transaction that reaches it.
transfer_hook_policy = "allow_all"
blocked_mint_extensions = ["transfer_fee_config", "non_transferable", "interest_bearing_config", "mint_close_authority", "confidential_mint_burn"]
blocked_account_extensions = ["non_transferable_account", "confidential_transfer_account", "memo_transfer", "cpi_guard"]

[metrics]
enabled = true
endpoint = "/metrics"
port = 9090
scrape_interval = 60

[metrics.fee_payer_balance]
enabled = true
expiry_seconds = 30
