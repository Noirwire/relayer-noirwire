services:
  redis:
    image: redis:8-alpine
    # No published port: Redis is reachable only from other services on the compose network.
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped
    command:
      - sh
      - -c
      - 'exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_PASSWORD"'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  kora:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./kora.toml:/app/kora.toml:ro
      - ./signers.toml:/app/signers.toml:ro
      - ./.env:/app/.env:ro
    environment:
      - RUST_LOG=info
      - KORA_API_KEY=${KORA_API_KEY:?set KORA_API_KEY in .env, the RPC refuses unauthenticated use}
      - KORA_REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
    env_file:
      - .env
    command:
      - sh
      - -c
      - "kora --config /app/kora.toml --rpc-url ${RPC_URL:-http://127.0.0.1:8899} rpc start --signers-config /app/signers.toml"
    restart: unless-stopped
    depends_on:
      - redis

volumes:
  redis_data:
